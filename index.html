<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #F4ECE1;
      --card-bg: #FCF9F5;
      --card-border: #E2D7C7;
      --text-main: #2A2421;
      --text-muted: #736760;
      
      --accent-burgundy: #800020;
      --accent-burgundy-hover: #630018;
      
      --success-bg: #E8F5E9;
      --success-border: #A5D6A7;
      --success-text: #1B5E20;

      --error-bg: #FDF2F2;
      --error-border: #F5C6CB;
      --error-text: #842029;

      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      line-height: 1.5;
    }

    .app-container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .dates-list-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(42, 36, 33, 0.03);
      max-height: 400px;
      overflow-y: auto;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-burgundy);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--card-border);
    }

    .dates-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 24px;
    }

    .date-item {
      display: flex;
      gap: 10px;
      font-size: 0.88rem;
      border-bottom: 1px dashed var(--card-border);
      padding-bottom: 6px;
      align-items: baseline;
    }

    .date-year {
      font-weight: 700;
      color: var(--accent-burgundy);
      min-width: 90px;
      flex-shrink: 0;
    }

    .date-event {
      color: var(--text-main);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: #E2D7C7;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent-burgundy);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(42, 36, 33, 0.03);
    }

    .stat-icon {
      color: var(--accent-burgundy);
      display: flex;
      align-items: center;
    }

    .stat-info {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .main-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(42, 36, 33, 0.05);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .select-wrapper {
      position: relative;
    }

    select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background-color: var(--bg-main);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 16px;
      padding-right: 40px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    select:focus {
      outline: none;
      border-color: var(--accent-burgundy);
      box-shadow: 0 0 0 3px rgba(128, 0, 32, 0.12);
    }

    .select-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
    }

    .question-box {
      background-color: #FAF6F0;
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .question-text {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--bg-main);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: var(--font-sans);
      font-size: 1rem;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    input[type="text"]::placeholder {
      color: #A0938A;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-burgundy);
      background-color: #FFF;
      box-shadow: 0 0 0 3px rgba(128, 0, 32, 0.12);
    }

    button.btn-submit {
      background-color: var(--accent-burgundy);
      color: #FFF;
      border: none;
      border-radius: 10px;
      padding: 0 24px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(128, 0, 32, 0.18);
    }

    button.btn-submit:hover {
      background-color: var(--accent-burgundy-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(128, 0, 32, 0.25);
    }

    button.btn-submit:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(128, 0, 32, 0.15);
    }

    .alert {
      display: none;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert.success {
      display: flex;
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .alert.error {
      display: flex;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .alert-icon {
      display: flex;
      align-items: center;
      margin-top: 1px;
    }

    @media (max-width: 580px) {
      .dates-grid {
        grid-template-columns: 1fr;
      }
      .date-item {
        font-size: 0.85rem;
      }
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }
      .stat-card.accuracy-card {
        grid-column: span 2;
      }
      .input-group {
        flex-direction: column;
      }
      button.btn-submit {
        padding: 14px;
        justify-content: center;
      }
      .question-text {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <section class="dates-list-card">
      <h2 class="section-title">Исторические даты</h2>
      <div class="dates-grid" id="dates-grid"></div>
    </section>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>

    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="stat-icon"><i data-lucide="check-circle-2"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="score-correct">0</span>
          <span class="stat-label">Угадано</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon"><i data-lucide="target"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="score-total">0</span>
          <span class="stat-label">Всего попыток</span>
        </div>
      </div>

      <div class="stat-card accuracy-card">
        <div class="stat-icon"><i data-lucide="award"></i></div>
        <div class="stat-info">
          <span class="stat-value" id="score-accuracy">0%</span>
          <span class="stat-label">Точность</span>
        </div>
      </div>
    </div>

    <main class="main-card">
      
      <div class="select-wrapper">
        <select id="era-select">
          <option value="all">Все исторические эпохи</option>
          <option value="ancient">До XVI века (Навигатор ФИПИ)</option>
          <option value="modern">XVII–XVIII века</option>
          <option value="contemporary">XXI век (Культура и наука)</option>
        </select>
        <i data-lucide="chevron-down" class="select-icon"></i>
      </div>

      <div class="question-box">
        <div class="question-text" id="event-display">Загрузка...</div>
      </div>

      <div class="input-group">
        <input type="text" id="year-input" placeholder="Введите год..." autocomplete="off">
        <button class="btn-submit" id="check-btn">
          Ответить
          <i data-lucide="arrow-right" size="18"></i>
        </button>
      </div>

      <div id="feedback-alert" class="alert">
        <div class="alert-icon" id="alert-icon"></div>
        <div class="alert-message" id="alert-message"></div>
      </div>

    </main>
  </div>

    let filteredData = [];
    let currentItem = null;
    let correctCount = 0;
    let totalCount = 0;
    let isAnswered = false;

    const eventDisplay = document.getElementById('event-display');
    const yearInput = document.getElementById('year-input');
    const checkBtn = document.getElementById('check-btn');
    const eraSelect = document.getElementById('era-select');
    const datesGrid = document.getElementById('dates-grid');
    
    const scoreCorrect = document.getElementById('score-correct');
    const scoreTotal = document.getElementById('score-total');
    const scoreAccuracy = document.getElementById('score-accuracy');
    const progressFill = document.getElementById('progress-fill');
    
    const alertBox = document.getElementById('feedback-alert');
    const alertIcon = document.getElementById('alert-icon');
    const alertMessage = document.getElementById('alert-message');

    function renderDatesList() {
      datesGrid.innerHTML = filteredData.map(item => `
        <div class="date-item">
          <span class="date-year">${item.year}</span>
          <span class="date-event">${item.event}</span>
        </div>
      `).join('');
    }

    function filterData() {
      const selectedEra = eraSelect.value;
      if (selectedEra === 'all') {
        filteredData = [...historyData];
      } else {
        filteredData = historyData.filter(item => item.era === selectedEra);
      }
      renderDatesList();
      nextQuestion();
    }

    function nextQuestion() {
      if (filteredData.length === 0) return;
      const randomIndex = Math.floor(Math.random() * filteredData.length);
      currentItem = filteredData[randomIndex];
      
      eventDisplay.textContent = currentItem.event;
      yearInput.value = '';
      yearInput.focus();
      hideAlert();
      isAnswered = false;
    }

    function cleanText(str) {
      return str.toString().toLowerCase().replace(/[\s\.\-\–\—\,]/g, '');
    }

    function checkAnswer() {
      if (!currentItem || isAnswered) return;
      
      const userVal = cleanText(yearInput.value);
      if (!userVal) return;

      const correctVal = cleanText(currentItem.year);
      totalCount++;

      if (userVal === correctVal) {
        correctCount++;
        showAlert('success', 'Отлично! Ответ абсолютно верный.');
        isAnswered = true;
        setTimeout(nextQuestion, 1200);
      } else {
        showAlert('error', `Неверно. Правильный ответ: <strong>${currentItem.year}</strong>`);
      }

      updateDashboard();
    }

    function updateDashboard() {
      scoreCorrect.textContent = correctCount;
      scoreTotal.textContent = totalCount;
      
      const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
      scoreAccuracy.textContent = `${accuracy}%`;

      const progress = Math.min(Math.round((totalCount / filteredData.length) * 100), 100);
      progressFill.style.width = `${progress}%`;
    }

    function showAlert(type, message) {
      alertBox.className = `alert ${type}`;
      alertMessage.innerHTML = message;

      if (type === 'success') {
        alertIcon.innerHTML = '<i data-lucide="check-circle" size="20"></i>';
      } else {
        alertIcon.innerHTML = '<i data-lucide="x-circle" size="20"></i>';
      }
      
      lucide.createIcons();
    }

    function hideAlert() {
      alertBox.className = 'alert';
      alertBox.style.display = 'none';
    }

    checkBtn.addEventListener('click', checkAnswer);
    yearInput.addEventListener('keypress', (e) => { 
      if (e.key === 'Enter') checkAnswer(); 
    });
    eraSelect.addEventListener('change', filterData);

    lucide.createIcons();
    filterData();
  </script>
